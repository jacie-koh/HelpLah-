name: Deploy HelpLah frontend to Railway

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "KampongSG Mobile App Design/**"
      - ".github/workflows/railway-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "KampongSG Mobile App Design"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "KampongSG Mobile App Design/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        run: railway up --detach --service "${{ secrets.RAILWAY_SERVICE_ID }}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
